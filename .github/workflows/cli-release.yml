name: cli-release

# Cuts a CLI release from a tag: cross-compiled binaries, checksums, and a
# changelog, published as a GitHub release. GoReleaser does the builds and the
# upload; cli/.goreleaser.yaml holds what it builds. The same tag also builds
# the server image in release.yml, so one tag releases both.

on:
  push:
    tags:
      - "v*"
  # A tag that does not build is a broken release, and by the time the tag
  # exists it is too late to fix it quietly. Pull requests run the same
  # GoReleaser config with publishing off, so a config or cross-build break
  # surfaces on the change that caused it.
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish:
    name: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Creating the release and uploading its assets writes to the repository.
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          # GoReleaser builds the changelog from the commits since the previous
          # tag and stamps the version from the tag itself. A shallow clone has
          # neither, and the run fails before it builds anything.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
          workdir: cli
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  snapshot:
    name: snapshot
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod

      # --snapshot builds every target and skips the publish steps entirely,
      # so it needs no token and cannot create a release by accident.
      - name: GoReleaser (no publish)
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean
          workdir: cli

      - name: Upload built binaries as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: snapshot
          path: cli/dist/*
          if-no-files-found: error
