name: coverage

# Line coverage for both modules, reported to Codecov. This is a report, not a
# gate: ci.yml decides whether the suite passes, and codecov.yml decides what
# Codecov grades.

on:
  push:
    branches: [main]
  pull_request:
  # codecov/patch is a required check, so the merge queue needs an upload
  # to grade; without this trigger a queued merge waits on it forever.
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # The Codecov upload authenticates with an OIDC token instead of a stored
  # secret, so forks and the merge queue upload the same way.
  id-token: write

jobs:
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Same database as ci.yml. Skipped end-to-end tests would report a
    # coverage number far below what the suite actually reaches.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lpm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/lpm_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod

      - name: Collect coverage
        run: |
          set -euo pipefail
          (cd server && go test -covermode=atomic -coverprofile=coverage.out ./...)
          (cd cli && go test -covermode=atomic -coverprofile=coverage.out ./...)

      # The upload is unconditional. codecov/patch is a required check, so a
      # run that uploads nothing leaves the check pending and the pull request
      # unmergeable with nothing the author can do about it.
      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: server/coverage.out,cli/coverage.out
          use_oidc: true
          fail_ci_if_error: true

      - name: Upload coverage.out as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            server/coverage.out
            cli/coverage.out
          if-no-files-found: error
