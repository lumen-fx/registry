# Generates the database password on first apply and stores it in a Secret. No
# password is committed, typed, or passed through a shell history, and nobody
# has to know it: only the Postgres pod and the server read the Secret.
#
# The Job is idempotent. A rerun finds the Secret already there and exits, so
# the password survives every later apply.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lpm-bootstrap
  namespace: lpm
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lpm-bootstrap
  namespace: lpm
rules:
  # create cannot be limited to one name, so this Role is the reason the
  # bootstrap ServiceAccount is not used by anything else.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["lpm-postgres"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lpm-bootstrap
  namespace: lpm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: lpm-bootstrap
subjects:
  - kind: ServiceAccount
    name: lpm-bootstrap
    namespace: lpm
---
apiVersion: batch/v1
kind: Job
metadata:
  name: lpm-bootstrap-secret
  namespace: lpm
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lpm-server
        app.kubernetes.io/component: bootstrap
    spec:
      restartPolicy: Never
      serviceAccountName: lpm-bootstrap
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          # alpine/k8s carries kubectl and a shell. The official kubectl
          # image is distroless, so `sh -c` would have nothing to run.
          image: alpine/k8s:1.31.0
          env:
            # kubectl writes a discovery cache under HOME.
            - name: HOME
              value: /tmp
          command:
            - sh
            - -c
            - |
              set -eu

              if kubectl get secret lpm-postgres >/dev/null 2>&1; then
                echo "lpm-postgres already exists, leaving it alone"
                exit 0
              fi

              # Alphanumeric only, so the password needs no escaping inside
              # the connection URL.
              password=$(tr -dc 'A-Za-z0-9' < /dev/urandom | head -c 32)

              kubectl create secret generic lpm-postgres \
                --from-literal=POSTGRES_DB=lpm \
                --from-literal=POSTGRES_USER=lpm \
                --from-literal=POSTGRES_PASSWORD="$password" \
                --from-literal=DATABASE_URL="postgres://lpm:$password@postgres.lpm.svc.cluster.local:5432/lpm?sslmode=disable"

              echo "created lpm-postgres"
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
