# Replace the host before applying. TLS assumes cert-manager issues the
# secret named below.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lpm-server
  namespace: lpm
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - registry.example.com
      secretName: lpm-server-tls
  rules:
    - host: registry.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lpm-server
                port:
                  name: http
