apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: lpm

resources:
  - namespace.yaml
  - configmap.yaml
  - bootstrap-secret.yaml
  - postgres.yaml
  - migration-job.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - poddisruptionbudget.yaml

# release.yml pushes this tag on every push to main. Pin a sha- tag for a
# deploy you want to be able to identify later.
images:
  - name: ghcr.io/lumen-fx/registry
    newTag: main

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: lpm
