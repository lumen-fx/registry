apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: lpm

resources:
  - namespace.yaml
  - configmap.yaml
  - bootstrap-secret.yaml
  - postgres.yaml
  - migration-job.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - poddisruptionbudget.yaml

images:
  - name: ghcr.io/lumen-fx/registry
    newTag: latest

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: lpm
