<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lpm: packages for Lumen and Candela</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2016%2016'%3E%3Ccircle%20cx='6'%20cy='8'%20r='4'%20fill='%234B83D6'/%3E%3Ccircle%20cx='11'%20cy='8'%20r='4'%20fill='%23D08700'%20fill-opacity='.85'/%3E%3C/svg%3E">
<style>
:root {
  --paper: #FAFAF8;
  --ink: #1D1C1A;
  --muted: #6F6A63;
  --line: #E5E2DC;
  --card: #FFFFFF;
  --daylight: #356FC4;   /* Lumen: cool light */
  --flame: #B36E00;      /* Candela: warm light */
  --glow: rgba(208, 135, 0, .25);
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #161513;
    --ink: #EAE7E1;
    --muted: #9B958C;
    --line: #2B2925;
    --card: #1D1B19;
    --daylight: #7FA9E8;
    --flame: #E0A63C;
    --glow: rgba(224, 166, 60, .22);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font: 15px/1.6 system-ui, sans-serif;
}
code, .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
main { max-width: 44rem; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }

header { display: flex; align-items: baseline; gap: .75rem; margin-bottom: 2rem; }
.wordmark {
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-size: 1.5rem; font-weight: 700; letter-spacing: -.02em;
  color: var(--ink); text-decoration: none;
}
.wordmark .dot-l, .wordmark .dot-c {
  display: inline-block; width: .45em; height: .45em; border-radius: 50%;
  margin-left: .18em; vertical-align: baseline;
}
.wordmark .dot-l { background: var(--daylight); }
.wordmark .dot-c { background: var(--flame); }
.tagline { color: var(--muted); font-size: .85rem; }

.lamp { display: flex; gap: .5rem; margin-bottom: .75rem; }
.lamp input[type=search] {
  flex: 1; min-width: 0;
  padding: .6rem .8rem;
  font: inherit; color: var(--ink);
  background: var(--card);
  border: 1px solid var(--line); border-radius: .5rem;
}
.lamp select {
  padding: .6rem .5rem;
  font: inherit; color: var(--ink);
  background: var(--card);
  border: 1px solid var(--line); border-radius: .5rem;
}
.lamp input:focus, .lamp select:focus, a:focus-visible {
  outline: none;
  border-color: var(--flame);
  box-shadow: 0 0 0 4px var(--glow);
}
a:focus-visible { border-radius: .2rem; }

.section-label {
  font-size: .72rem; font-weight: 600; letter-spacing: .09em;
  text-transform: uppercase; color: var(--muted);
  margin: 1.75rem 0 .25rem;
}

.card { padding: .9rem 0; border-bottom: 1px solid var(--line); }
.card-head { display: flex; align-items: baseline; gap: .6rem; flex-wrap: wrap; }
.pkg-name {
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-weight: 600; font-size: 1rem;
  color: var(--ink); text-decoration: none;
}
.pkg-name:hover { text-decoration: underline; }
.badge {
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-size: .68rem; letter-spacing: .06em; text-transform: uppercase;
  padding: .05rem .45rem; border-radius: 99px; border: 1px solid;
}
.badge.lumen { color: var(--daylight); border-color: var(--daylight); }
.badge.candela { color: var(--flame); border-color: var(--flame); }
.badge.other { color: var(--muted); border-color: var(--line); }
.card p { margin: .25rem 0 0; color: var(--muted); }
.byline { font-size: .8rem; color: var(--muted); }
.byline a { color: inherit; }

h1 {
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  font-size: 1.6rem; letter-spacing: -.02em; margin: 0 0 .25rem;
  display: flex; align-items: center; gap: .6rem; flex-wrap: wrap;
}
.crumb { font-size: .85rem; margin-bottom: 1.5rem; }
a { color: var(--flame); }
.desc { margin: .5rem 0 0; }

.release { display: flex; align-items: baseline; gap: .8rem; padding: .7rem 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.release .version { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-weight: 600; min-width: 5rem; }
.release time { color: var(--muted); font-size: .85rem; }
.release .rel-desc { color: var(--muted); flex: 1 1 12rem; }
.rel-details {
  flex-basis: 100%; display: flex; align-items: baseline; gap: .4rem .8rem;
  flex-wrap: wrap; font-size: .85rem; margin-top: .3rem;
}
.rel-details .artifact {
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  white-space: nowrap;
}
.rel-details .artifact-size { color: var(--muted); margin-right: .6rem; }
.rel-details .deps { color: var(--muted); }

.state { color: var(--muted); padding: 2rem 0; }

.who { margin-left: auto; font-size: .85rem; }
button {
  font: inherit; color: var(--ink);
  background: var(--card);
  border: 1px solid var(--line); border-radius: .5rem;
  padding: .45rem .9rem; cursor: pointer;
}
button:hover { border-color: var(--flame); }
button:focus-visible { outline: none; border-color: var(--flame); box-shadow: 0 0 0 4px var(--glow); }
.mint { display: flex; gap: .5rem; margin: .5rem 0 1rem; }
.mint input {
  flex: 1; min-width: 0; padding: .45rem .8rem;
  font: inherit; color: var(--ink);
  background: var(--card);
  border: 1px solid var(--line); border-radius: .5rem;
}
.mint input:focus { outline: none; border-color: var(--flame); box-shadow: 0 0 0 4px var(--glow); }
.secret {
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  background: var(--card); border: 1px solid var(--flame); border-radius: .5rem;
  padding: .7rem .8rem; margin: .5rem 0; word-break: break-all;
}
.token-row, .pkg-row { display: flex; align-items: baseline; gap: .8rem; padding: .6rem 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.token-row .name, .pkg-row .name { font-weight: 600; }
.token-row time, .token-row .meta, .pkg-row .meta { color: var(--muted); font-size: .85rem; }
.token-row button, .pkg-row button { margin-left: auto; padding: .2rem .7rem; font-size: .85rem; }
.stat { display: flex; align-items: baseline; gap: .5rem; flex-wrap: wrap; margin-top: 1.25rem; }
.stat .count { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-weight: 600; }
.stat .note { color: var(--muted); font-size: .8rem; }
.chart { display: block; width: 100%; height: 4rem; margin-top: .5rem; }
.chart rect { fill: var(--daylight); }
.chart-scale { display: flex; justify-content: space-between; color: var(--muted); font-size: .75rem; }

.readme { border-top: 1px solid var(--line); margin-top: 1.5rem; padding-top: .5rem; overflow-wrap: break-word; }
.readme img { max-width: 100%; }
.readme h1, .readme h2, .readme h3, .readme h4 {
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  letter-spacing: -.01em; line-height: 1.3; margin: 1.4rem 0 .5rem;
}
.readme h1 { font-size: 1.25rem; }
.readme h2 { font-size: 1.1rem; }
.readme h3, .readme h4 { font-size: 1rem; }
.readme pre {
  background: var(--card); border: 1px solid var(--line); border-radius: .5rem;
  padding: .7rem .8rem; overflow-x: auto;
}
.readme code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: .9em; }
.readme table { border-collapse: collapse; display: block; overflow-x: auto; }
.readme th, .readme td { border: 1px solid var(--line); padding: .3rem .55rem; text-align: left; }
.readme blockquote {
  margin: .9rem 0; padding-left: .8rem;
  border-left: 3px solid var(--line); color: var(--muted);
}
.readme hr { border: 0; border-top: 1px solid var(--line); }

@media (prefers-reduced-motion: no-preference) {
  .lamp input, .lamp select { transition: box-shadow .15s ease, border-color .15s ease; }
}
</style>
</head>
<body>
<main>
  <header>
    <a class="wordmark" href="#/">lpm<span class="dot-l"></span><span class="dot-c"></span></a>
    <span class="tagline">packages for Lumen and Candela</span>
    <span id="who" class="who"></span>
  </header>
  <div id="view"></div>
</main>
<script>
"use strict";
const view = document.getElementById("view");

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

function day(iso) {
  return iso ? iso.slice(0, 10) : "";
}

// Artifact sizes run from a few kB to a few hundred MB, so one unit for all
// of them reads badly at one end or the other.
function size(bytes) {
  if (!bytes) return "";
  const units = ["B", "kB", "MB", "GB"];
  let n = bytes, i = 0;
  while (n >= 1024 && i < units.length - 1) { n /= 1024; i += 1; }
  return (i === 0 ? n : n.toFixed(1)) + " " + units[i];
}

function badgeFor(platform) {
  const p = (platform || "").toLowerCase();
  const cls = p === "lumen" ? "lumen" : p === "candela" ? "candela" : "other";
  return el("span", "badge " + cls, platform || "any");
}

async function fetchJSON(path) {
  const res = await fetch(path, { headers: { Accept: "application/json" } });
  if (res.status === 404) return null;
  if (!res.ok) throw new Error("registry answered " + res.status);
  return res.json();
}

function state(text) {
  view.replaceChildren(el("p", "state", text));
}

function packageCard(pkg) {
  const card = el("article", "card");
  const head = el("div", "card-head");
  const name = el("a", "pkg-name", pkg.name);
  name.href = "#/p/" + encodeURIComponent(pkg.name);
  head.append(name, badgeFor(pkg.platform));
  if (pkg.releases && pkg.releases.length) {
    head.append(el("span", "byline mono", pkg.releases[0].version));
  }
  card.append(head);
  if (pkg.description) card.append(el("p", "", pkg.description));
  if (pkg.publisher) {
    const by = el("div", "byline");
    by.append("published by ");
    const who = el("a", "", pkg.publisher.username);
    who.href = "#/u/" + encodeURIComponent(pkg.publisher.username);
    by.append(who);
    card.append(by);
  }
  return card;
}

function packageList(pkgs, emptyText) {
  const wrap = el("div");
  if (!pkgs || !pkgs.length) {
    wrap.append(el("p", "state", emptyText));
    return wrap;
  }
  for (const p of pkgs) wrap.append(packageCard(p));
  return wrap;
}

let searchTimer;
async function renderHome() {
  const lamp = el("div", "lamp");
  const input = el("input");
  input.type = "search";
  input.placeholder = "Search packages";
  input.setAttribute("aria-label", "Search packages");
  const select = el("select");
  select.setAttribute("aria-label", "Platform");
  for (const [value, label] of [["", "All platforms"], ["lumen", "Lumen"], ["candela", "Candela"]]) {
    const opt = el("option", "", label);
    opt.value = value;
    select.append(opt);
  }
  const label = el("div", "section-label", "Newest packages");
  const results = el("div");

  async function search() {
    const q = input.value.trim();
    const params = new URLSearchParams();
    if (q) params.set("q", q);
    if (select.value) params.set("platform", select.value);
    label.textContent = q || select.value ? "Results" : "Newest packages";
    try {
      const pkgs = await fetchJSON("/packages" + (params.size ? "?" + params : ""));
      results.replaceChildren(packageList(pkgs, "No packages match that search."));
    } catch {
      results.replaceChildren(el("p", "state", "The registry did not respond. Retry in a moment."));
    }
  }

  input.addEventListener("input", () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(search, 250);
  });
  select.addEventListener("change", search);

  lamp.append(input, select);
  view.replaceChildren(lamp, label, results);
  input.focus({ preventScroll: true });
  await search();
}

const SVG_NS = "http://www.w3.org/2000/svg";

// Markdown and the sanitiser are loaded the first time a README is shown, so
// searching the registry never pays for them. Both are served from /assets
// under a versioned name, so the browser caches them for good.
let markdownLibraries;
function loadMarkdown() {
  markdownLibraries ||= Promise.all([
    import("/assets/marked-18.0.13.esm.js"),
    import("/assets/purify-3.4.15.esm.js"),
  ]);
  return markdownLibraries;
}

// A README is written by whoever published the package, so it is untrusted
// input: it goes through DOMPurify before it reaches the page, and this is the
// only place in the UI that assigns HTML at all.
async function renderMarkdown(text, sourceURL) {
  const [marked, purify] = await loadMarkdown();
  const panel = el("div", "readme");
  panel.innerHTML = purify.default.sanitize(marked.parse(text, { gfm: true }));
  resolveLinks(panel, sourceURL);
  return panel;
}

// A README links and shows images by paths relative to its own repository.
// Left alone they would point at the registry, so they are resolved against
// the file the markdown came from: links to the repository, images to the raw
// file GitHub serves.
function resolveLinks(panel, sourceURL) {
  let linkBase, imageBase;
  try {
    linkBase = new URL(sourceURL);
    imageBase = new URL(sourceURL.replace("/blob/", "/raw/"));
  } catch {
    return;
  }

  for (const [nodes, attr, base] of [
    [panel.querySelectorAll("a[href]"), "href", linkBase],
    [panel.querySelectorAll("img[src]"), "src", imageBase],
  ]) {
    for (const node of nodes) {
      let resolved;
      try {
        resolved = new URL(node.getAttribute(attr), base);
      } catch {
        node.removeAttribute(attr);
        continue;
      }
      if (resolved.protocol !== "https:" && resolved.protocol !== "http:") {
        node.removeAttribute(attr);
        continue;
      }
      node.setAttribute(attr, resolved.href);
      if (attr === "href") node.rel = "noopener nofollow ugc";
    }
  }
}

// One bar per day. Days the registry did not sample are gaps in the series,
// so the range is filled in and a missing day draws nothing.
function densify(days) {
  const counts = new Map(days.map((d) => [d.day, d.count]));
  const filled = [];
  const at = new Date(days[0].day + "T00:00:00Z");
  const last = new Date(days[days.length - 1].day + "T00:00:00Z");
  while (at <= last) {
    const key = at.toISOString().slice(0, 10);
    filled.push({ day: key, count: counts.get(key) || 0 });
    at.setUTCDate(at.getUTCDate() + 1);
  }
  return filled;
}

const CHART_DAYS = 90;

function downloadsChart(days) {
  const series = densify(days).slice(-CHART_DAYS);
  const width = 300, height = 60;
  const max = Math.max(...series.map((d) => d.count), 1);
  const step = width / series.length;

  const svg = document.createElementNS(SVG_NS, "svg");
  svg.setAttribute("class", "chart");
  svg.setAttribute("viewBox", "0 0 " + width + " " + height);
  // The bars carry the shape; stretching them to the column is the point.
  svg.setAttribute("preserveAspectRatio", "none");
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label",
    "Downloads per day from " + series[0].day + " to " + series[series.length - 1].day);

  series.forEach((d, i) => {
    if (!d.count) return;
    // A day with any downloads at all keeps a visible bar.
    const h = Math.max(1, (d.count / max) * height);
    const bar = document.createElementNS(SVG_NS, "rect");
    bar.setAttribute("x", (i * step).toFixed(2));
    bar.setAttribute("y", (height - h).toFixed(2));
    bar.setAttribute("width", Math.max(step * 0.8, 0.5).toFixed(2));
    bar.setAttribute("height", h.toFixed(2));
    const label = document.createElementNS(SVG_NS, "title");
    label.textContent = d.day + ": " + d.count;
    bar.append(label);
    svg.append(bar);
  });

  const scale = el("div", "chart-scale");
  scale.append(el("span", "", series[0].day), el("span", "", series[series.length - 1].day));

  const wrap = el("div");
  wrap.append(svg, scale);
  return wrap;
}

// Downloads are of the archives on GitHub, counted by GitHub, so the label
// says so: an installed package and a fetched archive are not the same thing.
function downloadsPanel(downloads) {
  if (!downloads || (!downloads.total && !(downloads.days || []).length)) return null;

  const wrap = el("div");
  const stat = el("div", "stat");
  stat.append(el("span", "count", downloads.total.toLocaleString() + " downloads"));
  stat.append(el("span", "note", "of the release archives on GitHub"));
  wrap.append(stat);

  const days = downloads.days || [];
  if (days.length < 2) {
    wrap.append(el("p", "byline", "Daily figures start once the registry has sampled GitHub twice."));
  } else {
    wrap.append(downloadsChart(days));
  }
  return wrap;
}

async function renderPackage(name) {
  state("Looking up " + name + "...");
  let pkg;
  try {
    pkg = await fetchJSON("/packages/" + encodeURIComponent(name));
  } catch {
    return state("The registry did not respond. Retry in a moment.");
  }
  if (!pkg) return state("No package is named " + name + ".");

  const crumb = el("div", "crumb");
  const back = el("a", "", "<- all packages");
  back.href = "#/";
  crumb.append(back);

  const h = el("h1");
  h.append(document.createTextNode(pkg.name), badgeFor(pkg.platform));

  const frag = document.createDocumentFragment();
  frag.append(crumb, h);
  if (pkg.description) frag.append(el("p", "desc", pkg.description));
  if (pkg.publisher) {
    const by = el("div", "byline");
    by.append("published by ");
    const who = el("a", "", pkg.publisher.username);
    who.href = "#/u/" + encodeURIComponent(pkg.publisher.username);
    by.append(who, document.createTextNode(" (since " + day(pkg.createdAt) + ")"));
    frag.append(by);
  }

  // The README is long, so it sits under the versions a visitor came for.
  const downloads = el("div");
  const readme = el("div");
  frag.append(downloads);

  frag.append(el("div", "section-label", "Releases"));
  if (!pkg.releases || !pkg.releases.length) {
    frag.append(el("p", "state", "No releases published yet."));
  } else {
    for (const r of pkg.releases) {
      const row = el("div", "release");
      row.append(el("span", "version", r.version));
      const t = el("time", "", day(r.createdAt));
      t.dateTime = r.createdAt || "";
      row.append(t);
      if (r.description) row.append(el("span", "rel-desc", r.description));

      const details = el("div", "rel-details");

      for (const a of r.artifacts || []) {
        const dl = el("a", "artifact", a.target);
        dl.href = a.url;
        dl.rel = "noopener";
        dl.title = "sha256:" + a.sha256;
        details.append(dl, el("span", "artifact-size", size(a.size)));
      }

      const deps = Object.keys(r.dependencies || {}).sort();
      if (deps.length) {
        details.append(el("span", "deps",
          "depends on " + deps.map((d) => d + " " + r.dependencies[d]).join(", ")));
      }

      if (details.childNodes.length) row.append(details);
      frag.append(row);
    }
  }
  frag.append(readme);
  view.replaceChildren(frag);

  // Both read GitHub through the registry's cache, so they arrive after the
  // page and a package with neither shows neither.
  fillDownloads(pkg.name, downloads);
  fillReadme(pkg.name, readme);
}

async function fillDownloads(name, host) {
  let downloads;
  try {
    downloads = await fetchJSON("/packages/" + encodeURIComponent(name) + "/downloads");
  } catch {
    return;
  }
  const panel = downloadsPanel(downloads);
  if (panel) host.replaceChildren(panel);
}

async function fillReadme(name, host) {
  let readme;
  try {
    readme = await fetchJSON("/packages/" + encodeURIComponent(name) + "/readme");
  } catch {
    return;
  }
  if (!readme || !readme.markdown) return;

  const label = el("div", "section-label", "Readme");
  const byline = el("div", "byline");
  if (readme.source) {
    const source = el("a", "", "from the repository at " + readme.version);
    source.href = readme.source;
    source.rel = "noopener";
    byline.append(source);
  }
  if (readme.stale) {
    byline.append(document.createTextNode(
      byline.childNodes.length ? ", last read when GitHub was reachable" : "Last read when GitHub was reachable"));
  }

  try {
    host.replaceChildren(label, byline, await renderMarkdown(readme.markdown, readme.source));
  } catch {
    host.replaceChildren(label, byline,
      el("p", "state", "This README could not be rendered here. The link above shows it on GitHub."));
  }
}

async function renderUser(username) {
  state("Looking up " + username + "...");
  let user;
  try {
    user = await fetchJSON("/users/" + encodeURIComponent(username));
  } catch {
    return state("The registry did not respond. Retry in a moment.");
  }
  if (!user) return state("No user is named " + username + ".");

  const crumb = el("div", "crumb");
  const back = el("a", "", "<- all packages");
  back.href = "#/";
  crumb.append(back);

  const h = el("h1", "", user.username);
  const since = el("div", "byline", "member since " + day(user.createdAt));

  const frag = document.createDocumentFragment();
  frag.append(crumb, h, since, el("div", "section-label", "Packages"));
  frag.append(packageList(user.packages, "Nothing published yet."));
  view.replaceChildren(frag);
}

async function whoami() {
  const res = await fetch("/auth/me");
  if (!res.ok) return null;
  return res.json();
}

async function renderHeader() {
  const who = document.getElementById("who");
  let me = null;
  try {
    me = await whoami();
  } catch {
    // The header stays quiet when the registry is unreachable.
  }
  if (!me) {
    const signIn = el("a", "", "Sign in with GitHub");
    signIn.href = "/auth/github/login";
    who.replaceChildren(signIn);
    return;
  }
  const account = el("a", "", me.username);
  account.href = "#/account";
  who.replaceChildren(account);
}

async function renderAccount() {
  let me = null;
  try {
    me = await whoami();
  } catch {
    return state("The registry did not respond. Retry in a moment.");
  }
  if (!me) {
    const p = el("p", "state");
    p.append("Sign in first: ");
    const signIn = el("a", "", "sign in with GitHub");
    signIn.href = "/auth/github/login";
    p.append(signIn, document.createTextNode("."));
    view.replaceChildren(p);
    return;
  }

  const crumb = el("div", "crumb");
  const back = el("a", "", "<- all packages");
  back.href = "#/";
  crumb.append(back);

  const h = el("h1", "", me.username);
  const signOut = el("button", "", "Sign out");
  signOut.addEventListener("click", async () => {
    await fetch("/auth/logout", { method: "POST" });
    location.hash = "#/";
    renderHeader();
    route();
  });

  const packagesLabel = el("div", "section-label", "Your packages");
  const packagesHint = el("p", "byline",
    "Delete frees a name you claimed and never published to. A package with " +
    "releases stays, because installs resolve against it.");
  const packages = el("div");

  async function refreshPackages() {
    try {
      const mine = await fetchJSON("/users/" + encodeURIComponent(me.username) + "/packages");
      packages.replaceChildren();
      if (!mine || !mine.length) {
        packages.append(el("p", "state", "Nothing published yet. Claim a name with lpm publish."));
        return;
      }
      for (const pkg of mine) {
        const row = el("div", "pkg-row");
        const name = el("a", "name", pkg.name);
        name.href = "#/p/" + encodeURIComponent(pkg.name);
        row.append(name, badgeFor(pkg.platform));
        const count = pkg.releases ? pkg.releases.length : 0;
        row.append(el("span", "meta", count === 1 ? "1 release" : count + " releases"));
        if (count === 0) {
          const remove = el("button", "", "Delete");
          remove.addEventListener("click", async () => {
            if (!confirm("Delete " + pkg.name + "? The name goes free for anyone to claim.")) return;
            const res = await fetch("/packages/" + encodeURIComponent(pkg.name), { method: "DELETE" });
            if (!res.ok) {
              const refused = await res.json().catch(() => null);
              packages.append(el("p", "state", refused && refused.error
                ? "Deleting " + pkg.name + ": " + refused.error
                : "Deleting " + pkg.name + " failed. Retry in a moment."));
              return;
            }
            refreshPackages();
          });
          row.append(remove);
        }
        packages.append(row);
      }
    } catch {
      packages.replaceChildren(el("p", "state", "The registry did not respond. Retry in a moment."));
    }
  }

  const tokensLabel = el("div", "section-label", "API tokens");
  const hint = el("p", "byline",
    "A token authenticates lpm on this machine: run lpm login and paste it, or set LPM_TOKEN in CI. " +
    "It is shown once, when created.");

  const mint = el("div", "mint");
  const nameInput = el("input");
  nameInput.placeholder = "What will use this token, e.g. laptop";
  nameInput.setAttribute("aria-label", "Token name");
  const create = el("button", "", "Create token");
  mint.append(nameInput, create);

  const secretBox = el("div");
  const list = el("div");

  async function refresh() {
    try {
      const tokens = await fetchJSON("/tokens");
      list.replaceChildren();
      if (!tokens || !tokens.length) {
        list.append(el("p", "state", "No tokens yet. Create one to publish from the CLI."));
        return;
      }
      for (const token of tokens) {
        const row = el("div", "token-row");
        row.append(el("span", "name", token.name));
        row.append(el("time", "", "created " + day(token.createdAt)));
        row.append(el("span", "meta",
          token.lastUsedAt ? "last used " + day(token.lastUsedAt) : "never used"));
        const revoke = el("button", "", "Revoke");
        revoke.addEventListener("click", async () => {
          await fetch("/tokens/" + token.id, { method: "DELETE" });
          refresh();
        });
        row.append(revoke);
        list.append(row);
      }
    } catch {
      list.replaceChildren(el("p", "state", "The registry did not respond. Retry in a moment."));
    }
  }

  create.addEventListener("click", async () => {
    const name = nameInput.value.trim();
    if (!name) {
      nameInput.focus();
      return;
    }
    const res = await fetch("/tokens", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name }),
    });
    if (!res.ok) {
      secretBox.replaceChildren(el("p", "state", "Creating the token failed. Retry in a moment."));
      return;
    }
    const created = await res.json();
    secretBox.replaceChildren(
      el("p", "byline", "Copy it now; it is not shown again."),
      el("div", "secret", created.token));
    nameInput.value = "";
    refresh();
  });

  view.replaceChildren(crumb, h, signOut, packagesLabel, packagesHint, packages,
    tokensLabel, hint, mint, secretBox, list);
  await refreshPackages();
  await refresh();
}

function route() {
  const hash = decodeURIComponent(location.hash);
  if (hash === "#/account") return renderAccount();
  const pkg = hash.match(/^#\/p\/(.+)$/);
  if (pkg) return renderPackage(pkg[1]);
  const user = hash.match(/^#\/u\/(.+)$/);
  if (user) return renderUser(user[1]);
  return renderHome();
}

addEventListener("hashchange", route);
renderHeader();
route();
</script>
</body>
</html>
